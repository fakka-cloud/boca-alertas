<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boca</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boca">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icono.png">
<style>
:root{
  --fondo:#0b0f1a; --tarjeta:#161c2b; --tarjeta2:#1d2436; --borde:#2a3450;
  --texto:#f2f4f8; --tenue:#8e97ad; --azul:#2b4bb5; --oro:#f5c518;
  --verde:#32d74b; --rojo:#ff453a; --alto:96px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.envoltorio{max-width:560px;margin:0 auto;padding:0 16px}

header{padding:22px 0 10px;display:flex;align-items:center;gap:12px}
header .escudo{width:46px;height:46px;object-fit:contain;flex:none}
header h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.6px}
header .sub{font-size:12px;color:var(--tenue);margin-top:2px}

.solapas{display:flex;gap:4px;background:var(--tarjeta);padding:4px;border-radius:12px;margin:14px 0 18px}
.solapas button{flex:1;border:0;background:transparent;color:var(--tenue);font-size:13px;font-weight:600;
  padding:9px 0;border-radius:9px;font-family:inherit;transition:.18s}
.solapas button.activa{background:var(--tarjeta2);color:var(--texto);box-shadow:0 1px 3px #0006}

.destacado{background:linear-gradient(150deg,#22306b,#141a2c);border:1px solid var(--borde);
  border-radius:20px;padding:18px;margin-bottom:20px}
.destacado .etiqueta{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--oro)}
.duelo{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 12px}
.duelo .lado{flex:1;text-align:center}
.duelo img{width:52px;height:52px;object-fit:contain}
.duelo .nombre{font-size:13px;font-weight:600;margin-top:8px;line-height:1.25}
.duelo .vs{font-size:13px;color:var(--tenue);font-weight:700}
.reloj{text-align:center;font-size:34px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.destacado .pie{text-align:center;color:var(--tenue);font-size:13px;margin-top:6px;line-height:1.5}

.dia{font-size:12px;font-weight:700;color:var(--tenue);text-transform:uppercase;
  letter-spacing:.8px;margin:20px 0 8px;padding-left:4px}
.fila{display:flex;align-items:center;gap:12px;background:var(--tarjeta);border:1px solid var(--borde);
  border-radius:16px;padding:13px 14px;margin-bottom:9px}
.fila .hora{width:46px;flex-shrink:0;text-align:center}
.fila .hora b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.fila .hora span{font-size:10px;color:var(--tenue);text-transform:uppercase}
.fila .medio{flex:1;min-width:0}
.fila .rival{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .datos{font-size:12px;color:var(--tenue);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .marcador{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.gano{color:var(--verde)} .perdio{color:var(--rojo)} .empato{color:var(--tenue)}
.local{display:inline-block;font-size:10px;font-weight:700;color:var(--oro);
  border:1px solid var(--oro);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:1px}
.vacio{text-align:center;color:var(--tenue);padding:40px 0;font-size:14px}
footer{text-align:center;color:var(--tenue);font-size:11px;margin-top:28px;line-height:1.7}

/* --- plantel y tabla --- */
.lideres{display:flex;gap:9px;margin-bottom:18px}
.lider{flex:1;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;
  padding:12px 10px;text-align:center;min-width:0}
.lider .que{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.7px}
.lider .cuanto{font-size:24px;font-weight:800;color:var(--oro);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.lider .quien{font-size:11px;color:var(--texto);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.equipo{background:var(--tarjeta);border:1px solid var(--borde);border-radius:20px;padding:16px;margin-bottom:22px}
.equipo .arriba{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.equipo .arriba .tit{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--oro)}
.equipo .arriba .form{font-size:12px;color:var(--tenue);font-weight:700}
.equipo .contra{font-size:15px;font-weight:600;margin-bottom:12px}
.equipo .contra .res{font-weight:800;margin-left:6px;font-variant-numeric:tabular-nums}
.once{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--borde)}
.once .nro{width:24px;text-align:center;font-size:12px;font-weight:700;color:var(--tenue);font-variant-numeric:tabular-nums;flex:none}
.once .quien{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.once .marca{font-size:11px;font-weight:700;flex:none}
.subtit{font-size:11px;font-weight:700;color:var(--tenue);text-transform:uppercase;
  letter-spacing:1px;margin:16px 0 2px}

.jug{display:flex;align-items:center;gap:11px;background:var(--tarjeta);border:1px solid var(--borde);
  border-radius:14px;padding:10px 13px;margin-bottom:7px}
.jug .nro{width:26px;flex:none;text-align:center;font-size:15px;font-weight:800;
  color:var(--oro);font-variant-numeric:tabular-nums}
.jug .medio{flex:1;min-width:0}
.jug .nom{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jug .meta{font-size:11px;color:var(--tenue);margin-top:2px}
.jug .cifras{font-size:11px;color:var(--tenue);text-align:right;flex:none;line-height:1.4;font-variant-numeric:tabular-nums}
.jug .cifras b{color:var(--texto);font-size:13px}

.tabla{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;overflow:hidden}
.tabla .cab,.tabla .eq{display:flex;align-items:center;gap:9px;padding:9px 13px;font-variant-numeric:tabular-nums}
.tabla .cab{font-size:10px;color:var(--tenue);text-transform:uppercase;letter-spacing:.8px}
.tabla .eq{border-top:1px solid var(--borde);font-size:14px}
.tabla .eq.boca{background:#22306b}
.tabla .pos{width:20px;text-align:center;font-size:12px;color:var(--tenue);flex:none}
.tabla .eq.boca .pos{color:var(--oro);font-weight:800}
.tabla img{width:20px;height:20px;object-fit:contain;flex:none}
.tabla .nom{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabla .num{width:32px;text-align:center;flex:none;font-size:13px;color:var(--tenue)}
.tabla .pts{width:32px;text-align:center;flex:none;font-weight:800}
.nota{font-size:11px;color:var(--tenue);text-align:center;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="envoltorio">
  <header>
    <img class="escudo" src="https://a.espncdn.com/i/teamlogos/soccer/500/5.png" alt="Boca">
    <div><h1>Boca</h1><div class="sub" id="actualizado"></div></div>
  </header>

  <div class="solapas">
    <button id="btn-proximos" class="activa">Próximos</button>
    <button id="btn-resultados">Resultados</button>
    <button id="btn-plantel">Plantel</button>
    <button id="btn-tabla">Tabla</button>
  </div>

  <div id="pantalla"></div>

  <footer>datos de ESPN · se actualiza solo todos los días<br>te llega un mail a las 9 cada vez que juega</footer>
</div>

<script>
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const SOLAPAS = ["proximos","resultados","plantel","tabla"];
let datos = {partidos: []}, club = null, solapa = "proximos";

const hoyAR = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
const aFecha = p => new Date(`${p.fecha}T${p.hora}:00-03:00`);

function titulo(iso) {
  const [a, m, d] = iso.split("-").map(Number);
  const f = new Date(Date.UTC(a, m - 1, d));
  const hoy = hoyAR();
  if (iso === hoy) return "Hoy";
  const manana = new Date(Date.UTC(...hoy.split("-").map((v, i) => i === 1 ? v - 1 : +v)) + 864e5)
    .toISOString().slice(0, 10);
  if (iso === manana) return "Mañana";
  return `${DIAS[f.getUTCDay()]} ${d} de ${MESES[m - 1]}`;
}

function rivalDe(p) { return p.de_local ? p.visitante : p.local; }

function fila(p, conMarcador) {
  const rival = rivalDe(p);
  const sello = p.de_local ? '<span class="local">LOCAL</span>' : "";
  let derecha = `<div class="hora"><b>${p.hora}</b><span>hs</span></div>`;
  if (conMarcador && p.goles_local !== null && p.goles_visitante !== null) {
    const propios = p.de_local ? p.goles_local : p.goles_visitante;
    const ajenos = p.de_local ? p.goles_visitante : p.goles_local;
    const clase = propios > ajenos ? "gano" : propios < ajenos ? "perdio" : "empato";
    derecha = `<div class="marcador ${clase}">${propios}-${ajenos}</div>`;
  }
  const izq = conMarcador
    ? `<div class="hora"><b>${p.fecha.slice(8)}</b><span>${MESES[+p.fecha.slice(5, 7) - 1]}</span></div>`
    : derecha;
  const der = conMarcador ? derecha : "";
  return `<div class="fila">${izq}
    <div class="medio">
      <div class="rival">${rival}${sello}</div>
      <div class="datos">${p.torneo} · ${p.estadio}</div>
    </div>${der}</div>`;
}

function cuentaAtras(p) {
  const faltan = aFecha(p) - new Date();
  if (faltan <= 0) return "¡Están jugando!";
  const d = Math.floor(faltan / 864e5), h = Math.floor(faltan / 36e5) % 24, m = Math.floor(faltan / 6e4) % 60;
  if (d > 0) return `faltan ${d}d ${h}h`;
  if (h > 0) return `faltan ${h}h ${m}m`;
  return `faltan ${m} min`;
}

function destacado(p) {
  const escudo = (u, n) => `<div class="lado">${u ? `<img src="${u}" alt="">` : ""}<div class="nombre">${n}</div></div>`;
  const cuando = p.fecha === hoyAR() ? "Hoy" : titulo(p.fecha);
  return `<div class="destacado">
    <div class="etiqueta">Próximo partido</div>
    <div class="duelo">
      ${escudo(p.escudo_local, p.local)}<div class="vs">VS</div>${escudo(p.escudo_visitante, p.visitante)}
    </div>
    <div class="reloj" id="reloj">${cuentaAtras(p)}</div>
    <div class="pie">${cuando} · ${p.hora} hs<br>${p.estadio}<br>${p.torneo}</div>
  </div>`;
}

/* ---------- plantel ---------- */

function lider(que, campo) {
  const gente = club.plantel.filter(j => j[campo] > 0);
  if (!gente.length) return `<div class="lider"><div class="que">${que}</div><div class="cuanto">0</div><div class="quien">—</div></div>`;
  const mejor = gente.reduce((a, b) => b[campo] > a[campo] ? b : a);
  const corto = mejor.nombre.split(" ").slice(-1)[0];
  return `<div class="lider"><div class="que">${que}</div>
    <div class="cuanto">${mejor[campo]}</div><div class="quien">${corto}</div></div>`;
}

function ultimoEquipo(u) {
  if (!u) return "";
  const clase = u.gano ? "gano" : u.perdio ? "perdio" : "empato";
  const linea = j => `<div class="once">
      <div class="nro">${j.dorsal}</div>
      <div class="quien">${j.nombre}</div>
      <div class="marca ${j.salio ? "perdio" : "gano"}">${j.salio ? "↓" : j.entro ? "↑" : ""}</div>
    </div>`;
  const suplentes = u.suplentes.filter(j => j.entro).concat(u.suplentes.filter(j => !j.entro));
  return `<div class="equipo">
    <div class="arriba"><div class="tit">Último equipo</div><div class="form">${u.formacion}</div></div>
    <div class="contra">vs ${u.rival}<span class="res ${clase}">${u.resultado}</span>
      <span style="color:var(--tenue);font-weight:400;font-size:13px"> · ${u.fecha}</span></div>
    ${u.titulares.map(linea).join("")}
    <div class="subtit">Suplentes</div>
    ${suplentes.map(linea).join("")}
  </div>`;
}

function pintarPlantel() {
  if (!club || !club.plantel.length) return '<div class="vacio">no pude cargar el plantel</div>';
  let html = `<div class="lideres">${lider("Goles", "goles")}${lider("Asistencias", "asistencias")}${lider("Amarillas", "amarillas")}</div>`;
  html += ultimoEquipo(club.ultimo);
  let puesto = null;
  club.plantel.forEach(j => {
    if (j.puesto !== puesto) { html += `<div class="dia">${j.puesto}</div>`; puesto = j.puesto; }
    const arq = j.puesto === "Arqueros";
    const cifras = arq
      ? `<b>${j.pj}</b> PJ`
      : `<b>${j.goles}</b> G · <b>${j.asistencias}</b> A<br>${j.pj} PJ`;
    html += `<div class="jug">
      <div class="nro">${j.dorsal || "–"}</div>
      <div class="medio">
        <div class="nom">${j.nombre}</div>
        <div class="meta">${j.pais}${j.edad ? " · " + j.edad + " años" : ""}</div>
      </div>
      <div class="cifras">${cifras}</div>
    </div>`;
  });
  html += '<div class="nota">los partidos jugados y los goles son de toda la temporada</div>';
  return html;
}

function pintarTabla() {
  if (!club || !club.tabla.filas.length) return '<div class="vacio">no pude cargar la tabla</div>';
  const filas = club.tabla.filas.map(e => `<div class="eq ${e.es_boca ? "boca" : ""}">
      <div class="pos">${e.puesto}</div>
      <img src="${e.escudo}" alt="">
      <div class="nom">${e.equipo}</div>
      <div class="num">${e.pj}</div>
      <div class="num">${e.dif}</div>
      <div class="pts">${e.pts}</div>
    </div>`).join("");
  return `<div class="dia">${club.tabla.zona}</div>
    <div class="tabla">
      <div class="cab"><div class="pos">#</div><div style="width:20px"></div>
        <div class="nom">Equipo</div><div class="num">PJ</div><div class="num">DIF</div><div class="pts">PTS</div></div>
      ${filas}
    </div>`;
}

/* ---------- ---------- */

function pintar() {
  const pantalla = document.getElementById("pantalla");
  const hoy = hoyAR();
  SOLAPAS.forEach(s => document.getElementById("btn-" + s).classList.toggle("activa", solapa === s));

  if (solapa === "proximos") {
    const proximos = datos.partidos.filter(p => p.fecha >= hoy && !p.jugado);
    if (!proximos.length) { pantalla.innerHTML = '<div class="vacio">todavía no hay fechas confirmadas</div>'; return; }
    let html = destacado(proximos[0]), ultimoDia = null;
    proximos.slice(1).forEach(p => {
      if (p.fecha !== ultimoDia) { html += `<div class="dia">${titulo(p.fecha)}</div>`; ultimoDia = p.fecha; }
      html += fila(p, false);
    });
    pantalla.innerHTML = html;
  } else if (solapa === "resultados") {
    const jugados = datos.partidos.filter(p => p.jugado).reverse();
    pantalla.innerHTML = jugados.length
      ? jugados.map(p => fila(p, true)).join("")
      : '<div class="vacio">sin resultados todavía</div>';
  } else if (solapa === "plantel") {
    pantalla.innerHTML = pintarPlantel();
  } else {
    pantalla.innerHTML = pintarTabla();
  }
}

SOLAPAS.forEach(s => { document.getElementById("btn-" + s).onclick = () => { solapa = s; pintar(); }; });

fetch("plantel.json?v=" + Date.now()).then(r => r.json()).then(d => {
  club = d;
  if (solapa === "plantel" || solapa === "tabla") pintar();
}).catch(() => {});

fetch("partidos.json?v=" + Date.now()).then(r => r.json()).then(d => {
  datos = d;
  document.getElementById("actualizado").textContent = "actualizado " + d.actualizado + " hs";
  pintar();
  setInterval(() => {
    const reloj = document.getElementById("reloj");
    const prox = datos.partidos.filter(p => p.fecha >= hoyAR() && !p.jugado)[0];
    if (reloj && prox) reloj.textContent = cuentaAtras(prox);
  }, 30000);
}).catch(() => {
  document.getElementById("pantalla").innerHTML = '<div class="vacio">no pude cargar los partidos</div>';
});
</script>
</body>
</html>
